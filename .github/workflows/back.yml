# 백엔드 CI
# - PR(→ main), main 반영: ./gradlew build (테스트는 H2, test profile)
# 배포 단계는 운영 서버가 정해지면 추가한다.
name: back

on:
  pull_request:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/back.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: back-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # gradlew에 실행 권한이 없어 bash로 실행한다
      - run: bash gradlew build
